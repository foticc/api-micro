<app-page-header [pageHeaderInfo]="pageHeader" />

<div class="normal-table-wrap codegen-page">
  <nz-card nzTitle="方案库" [nzExtra]="listExtra">
    <div class="schema-toolbar">
      <input class="schema-search" name="schemaKeyword" nz-input placeholder="搜索名称 / 模块 / 备注" [(ngModel)]="schemaKeyword" (keyup.enter)="searchSchemas()" />
      <button nz-button nzType="primary" (click)="searchSchemas()">查询</button>
      <button nz-button (click)="resetSchemaSearch()">重置</button>
    </div>

    <nz-table #schemaTable nzSize="middle" [nzData]="schemaList()" [nzFrontPagination]="false" [nzLoading]="schemaLoading()" [nzShowPagination]="false">
      <thead>
        <tr>
          <th nzWidth="200px">方案名称</th>
          <th nzWidth="120px">模块</th>
          <th nzWidth="110px">目标</th>
          <th>备注</th>
          <th nzWidth="160px">更新时间</th>
          <th nzWidth="180px">操作</th>
        </tr>
      </thead>
      <tbody>
        @for (row of schemaTable.data; track row.id) {
          <tr>
            <td>{{ row.name }}</td>
            <td>{{ row.moduleName }}</td>
            <td>
              <nz-tag [nzColor]="row.target === 'frontend' ? 'blue' : 'green'">{{ targetLabel(row.target) }}</nz-tag>
            </td>
            <td class="text-secondary">{{ row.remark || '—' }}</td>
            <td>{{ row.updatedAt ? (row.updatedAt | date: 'yyyy-MM-dd HH:mm') : '—' }}</td>
            <td>
              <span class="operate-text" (click)="previewSchema(row)">预览</span>
              <nz-divider nzType="vertical" />
              <span class="operate-text" (click)="editSchema(row)">编辑</span>
              <nz-divider nzType="vertical" />
              <span class="operate-text" (click)="deleteSchema(row)">删除</span>
            </td>
          </tr>
        }
      </tbody>
    </nz-table>

    <div class="schema-pagination">
      <nz-pagination
        [nzPageIndex]="schemaPageIndexValue()"
        [nzPageSize]="schemaPageSizeValue()"
        [nzTotal]="schemaTotal()"
        [nzShowSizeChanger]="true"
        [nzPageSizeOptions]="[5, 10, 20]"
        (nzPageIndexChange)="onSchemaPageIndexChange($event)"
        (nzPageSizeChange)="onSchemaPageSizeChange($event)"
      />
    </div>
  </nz-card>

  <ng-template #listExtra>
    <button class="m-r-8" nz-button nzType="default" nzSize="small" (click)="reloadSchemaList()">
      <i nz-icon nzType="reload"></i>
      刷新
    </button>
    <button nz-button nzType="primary" nzSize="small" (click)="createSchema()">
      <i nz-icon nzType="plus"></i>
      新建方案
    </button>
  </ng-template>
</div>
