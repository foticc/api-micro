<app-page-header [pageHeaderInfo]="pageHeaderInfo" />

<div class="normal-table-wrap">
  <nz-card class="m-b-10" nzHoverable [nzBodyStyle]="{ 'padding-bottom': 0 }">
    <form nz-form>
      <div nz-row [nzGutter]="16">
        <div nz-col [nzLg]="6" [nzMd]="12" [nzSpan]="24">
          <nz-form-item>
            <nz-form-label>设备</nz-form-label>
            <nz-form-control>
              <input nz-input readonly placeholder="请选择设备" [value]="deviceLabel()" (click)="chooseDevice()" />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzLg]="6" [nzMd]="12" [nzSpan]="24">
          <nz-form-item>
            <nz-form-label>开始</nz-form-label>
            <nz-form-control>
              <nz-date-picker name="start" nzShowTime style="width: 100%" [(ngModel)]="start" />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div nz-col [nzLg]="6" [nzMd]="12" [nzSpan]="24">
          <nz-form-item>
            <nz-form-label>结束</nz-form-label>
            <nz-form-control>
              <nz-date-picker name="end" nzShowTime style="width: 100%" [(ngModel)]="end" />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div class="m-b-10" nz-col [nzLg]="6" [nzMd]="12" [nzSpan]="24">
          <button nz-button (click)="chooseDevice()">选择设备</button>
          <button class="m-l-15" nz-button nzType="primary" (click)="search()">
            <i nz-icon nzType="search"></i>
            查询
          </button>
        </div>
      </div>
    </form>
  </nz-card>

  <app-card-table-wrap [tableTitle]="tableTitle()" (reload)="reloadTable()">
    <app-ant-table
      [tableConfig]="tableConfig()"
      [tableData]="dataList()"
      (changePageIndex)="getDataList($event)"
      (changePageSize)="changePageSize($event)"
      (sortFn)="changeSort($event)"
    />
  </app-card-table-wrap>
</div>
